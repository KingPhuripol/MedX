# Dev/manual use only. Optional: the app defaults to SQLite. Binds to 127.0.0.1 only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: frontdoor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frontdoor_dev_only}
      POSTGRES_DB: frontdoor
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdoor -d frontdoor"]
      interval: 2s
      timeout: 3s
      retries: 30

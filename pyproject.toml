[project]
name = "clinical-front-door"
version = "0.1.0"
description = "Research prototype — not for clinical use. Slices s0-s1 (backend, casegraph, synthetic data_factory)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "casegraph/tests", "data_factory/tests", "research/tests", "eval/tests"]
pythonpath = [".", "backend"]
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider"
markers = [
    "pg: needs PostgreSQL (TEST_PG_URL); run via `make test-pg`, skipped otherwise",
]
